services:
  - type: web
    name: sentinel-network-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
  - type: worker
    name: sentinel-network-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: python -m app.worker
  - type: web
    name: sentinel-network-mcp
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.mcp_server:app --host 0.0.0.0 --port $PORT
